<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contextual Menu</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background-color: rgba(50, 50, 50, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .menu-button {
            padding: 12px 24px;
            background-color: #4A90E2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            user-select: none;
        }
        .menu-button:hover {
            background-color: #357ABD;
        }
        .menu-button:active {
            background-color: #2A5A8D;
        }
    </style>
</head>
<body>
    <button class="menu-button" id="menuBtn">Create Cube</button>
    
    <script>
        const btn = document.getElementById('menuBtn');
        
        btn.addEventListener('mouseenter', function() {
            document.title = 'REPAINT_REQUEST:hover';
        });

            document.title = 'REPAINT_REQUEST:leave';
        });
