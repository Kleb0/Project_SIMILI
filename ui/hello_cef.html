<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello CEF - SIMILI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            color: white;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: fadeInDown 1s ease;
        }
        
        p {
            font-size: 0.9em;
            margin-bottom: 8px;
            opacity: 0.9;
            animation: fadeIn 1.5s ease;
        }
        
        .tech-stack {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            animation: fadeInUp 2s ease;
        }
        
        .tech-stack h2 {
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        
        .tech-list {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .tech-item {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8em;
            transition: transform 0.3s ease;
        }      

        
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Hello CEF!</h1>
        <p>Bienvenue dans SIMILI avec Chromium Embedded Framework</p>
        <p>Interface moderne HTML5 + CSS3 + JavaScript</p>
        
        
    </div>
    
    <script>
        console.log('CEF Browser initialized successfully!');
        console.log('SIMILI UI ready!');
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded at: ' + new Date().toLocaleTimeString());
        });
    </script>
</body>
</html>
