<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deux Carrés</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 20px;
            position: relative;
        }
        .carre {
            width: 150px;
            height: 150px;
        }
        .bleu {
            background-color: rgb(0, 0, 255);
        }
        .rouge {
            background-color: rgb(255, 0, 0);
        }
        .action-btn {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 38px;
            border: 0;
            border-radius: 8px;
            background-color: rgb(255, 255, 255);
            color: rgb(0, 0, 0);
            font-size: 18px;
            cursor: pointer;
        }
        .action-btn:hover {
            background-color: rgb(60, 0, 255);
            color: rgb(255, 255, 255);
        }
    </style>
</head>
<body>
    <div class="carre bleu"></div>
    <div class="carre rouge"></div>
    <button class="action-btn" type="button">Action</button>
</body>
</html>
