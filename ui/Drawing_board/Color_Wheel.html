<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Wheel</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #3498db;
        }
        .color-display {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            cursor: crosshair;
            border: 2px solid #555;
        }
        .palette {
            display: flex;
            gap: 5px;
        }
        .color-box {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            cursor: pointer;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <h3>Color Wheel</h3>
    <div class="color-display"></div>
    <div class="palette">
        <div class="color-box" style="background-color: #ff5733;"></div>
        <div class="color-box" style="background-color: #33ff57;"></div>
        <div class="color-box" style="background-color: #3357ff;"></div>
        <div class="color-box" style="background-color: #f1c40f;"></div>
        <div class="color-box" style="background-color: #9b59b6;"></div>
    </div>
</body>
</html>
