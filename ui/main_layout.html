<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMILI UI</title>
    <link rel="stylesheet" href="http://localhost:8080/ui/main_layout.css">    
</head>
<body>
    <div class="main-container">
        <div class ="panel_above_UI">
             <iframe name="panel_above_UI"></iframe>
        </div>
        
        <!-- Top Bar -->
        <div class="top-bar-panel">
            <iframe src="http://localhost:8080/ui/Top_Bar.html"></iframe>
        </div>

        <!-- Top Row -->
        <div class="top-row">
            <!-- Left Section -->
            <div class="left-section">
                <!-- Hierarchy Inspector -->
                <div class="panel hierarchy-panel">
                    <iframe name="hierarchy_inspector" src="http://localhost:8080/ui/hierarchy_inspector.html"></iframe>
                </div>
            </div>

            <!-- Vertical Splitter 1 (between Hierarchy and Viewport) -->
            <!-- <div class="splitter splitter-vertical" data-direction="horizontal"></div> -->
            
            <!-- Center Section -->
            <div class="center-section">
                <!-- Viewport (OpenGL overlay will be positioned here) -->
                <div class="panel viewport-panel">
                    <iframe src="http://localhost:8080/ui/Viewport_docking.html"></iframe>
                </div>
            </div>

            <!-- Vertical Splitter 2 (between Center and Right) -->
            <!-- <div class="splitter splitter-vertical" data-direction="horizontal"></div> -->
            
            <!-- Right Section -->
            <div class="right-section">
                <!-- Object Inspector -->
                <div class="panel object-inspector-panel">
                    <iframe src="http://localhost:8080/ui/object_inspector.html"></iframe>
                </div>
                
                <!-- Right Horizontal Splitter (between Inspector and History) -->
                <div class="splitter splitter-horizontal" data-direction="vertical"></div>
                
                <!-- History Logger -->
                <div class="panel history-panel">
                    <iframe src="http://localhost:8080/ui/history_logger.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- Horizontal Splitter (between top row and project viewer) -->
        <!-- <div class="splitter splitter-horizontal" data-direction="vertical"></div> -->
        
        <!-- Project Viewer (full width at bottom) -->
        <div class="panel project-viewer-panel">
            <iframe src="http://localhost:8080/ui/project_viewer.html"></iframe>
        </div>
    </div>

    <script src="http://localhost:8080/ui/layout_resizer.js"></script>
    <script src="http://localhost:8080/ui/SendDataFieldsPositions.Js"></script>
    <script src="http://localhost:8080/ui/main_layout_manager.js"></script>
</body>
</html>
