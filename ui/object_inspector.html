<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Inspector</title>
    <link rel="stylesheet" href="http://localhost:8080/ui/object.inspector.css">
</head>
<body>
    <div id="inspector-container" data-panel="object_inspector_panel">
        <div class="inspector-title">Object Inspector</div>

        <div class="selected-object" data-field="selected_object">
            <label>Current Selected Object</label>
            <span class="selected-value"></span>
        </div>

        <div class="data-holder" data-field="position">
            <label>Position</label>
            <div class="slot">
                <span class="axis">X</span><input type="number" data-field="position_x" value="" step="0.1">
                <span class="axis">Y</span><input type="number" data-field="position_y" value="" step="0.1">
                <span class="axis">Z</span><input type="number" data-field="position_z" value="" step="0.1">
            </div>
        </div>

        <div class="data-holder" data-field="rotation">
            <label>Rotation</label>
            <div class="slot">
                <span class="axis">X</span><input type="number" data-field="rotation_x" value="" step="1">
                <span class="axis">Y</span><input type="number" data-field="rotation_y" value="" step="1">
                <span class="axis">Z</span><input type="number" data-field="rotation_z" value="" step="1">
            </div>
        </div>

        <div class="data-holder" data-field="scale">
            <label>Scale</label>
            <div class="slot">
                <span class="axis">X</span><input type="number" data-field="scale_x" value="" step="0.1">
                <span class="axis">Y</span><input type="number" data-field="scale_y" value="" step="0.1">
                <span class="axis">Z</span><input type="number" data-field="scale_z" value="" step="0.1">
            </div>
        </div>
    </div>

</body>
</html>
